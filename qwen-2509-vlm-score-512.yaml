    api_key: "LGM"
    vlm_model: "Qwen3.5-122B-A10B"
    max_concurrent: 50
    max_retries: 10
    timeout: 60
    top_logprobs: 20
    canonicalize: false
    max_cache_size: 1024
    frame_selection: "uniform"

