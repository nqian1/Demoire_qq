  # OCR IoU reward
  - name: "ocr_iou_reward"
    reward_model: "ocr_iou_reward"
    weight: 0.2
    batch_size: 8
    device: "cuda"
    dtype: float32
    # OCR参数
    ocr_upscale: 1
    # 原图OCR太少，不参与评价
    ocr_min_text_length: 1
    # OCR无法判断时返回中性奖励
    ocr_neutral_score: 0.5



